name: BSD

on:
  push:
  pull_request:

jobs:
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            set -eux
            pkg install -y gmake python3
          run: |
            set -eux
            PYTHON_BIN="$(command -v python3.13 || command -v python3.12 || command -v python3.11 || command -v python3)"
            PYTHON_CONFIG="$(command -v python3.13-config || command -v python3.12-config || command -v python3.11-config || command -v python3-config)"
            gmake CC=cc PYTHON="$PYTHON_BIN" PYTHON_CONFIG="$PYTHON_CONFIG"

      - name: Test JSON output on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y python3
          run: |
            set -eux
            ./bin/fetch --json | tee fetch.json
            PYTHON_BIN="$(command -v python3.13 || command -v python3.12 || command -v python3.11 || command -v python3)"
            "$PYTHON_BIN" - <<'PY'
            import json

            with open("fetch.json", encoding="utf-8") as stream:
                info = json.load(stream)
            assert isinstance(info, dict)
            assert isinstance(info["disks"], list)
            assert isinstance(info["memory"], dict)
            print(json.dumps(info, indent=2, sort_keys=True))
            print("JSON output is valid")
            PY

      - name: Test LARP frame cycle on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y python3
          run: |
            set -eux
            PYTHON_BIN="$(command -v python3.13 || command -v python3.12 || command -v python3.11 || command -v python3)"
            "$PYTHON_BIN" - <<'PY'
            import math
            import sys

            sys.path.insert(0, "larp")
            import larp

            logo = larp.load_logo("unknown")
            start = larp.shaded_logo(logo, 0.0, larp.RAMP, False)
            end = larp.shaded_logo(logo, math.tau, larp.RAMP, False)
            assert start == end, "logo does not return to its starting frame"
            for frame in range(15):
                angle = (frame / 15) * math.tau
                print(f"frame={frame + 1}/15 angle={angle:.6f}")
            print("LARP completes a 360 degree cycle")
            PY

      - name: Test LARP frame output on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y python3
          run: |
            set -eux
            ./bin/fetch --larp --frames 15 --no-color > frame-output.txt
            test -s frame-output.txt
            grep -q "CPU" frame-output.txt
            echo "LARP frame output is non-empty"

      - name: Test classic output on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y python3
          run: ./bin/fetch --classic

  openbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            set -eux
            pkg_add -I gmake 'python%3.12'
          run: |
            set -eux
            PYTHON_BIN="$(command -v python3.12 || command -v python3.13 || command -v python3.11 || command -v python3)"
            PYTHON_CONFIG="$(command -v python3.12-config || command -v python3.13-config || command -v python3.11-config || command -v python3-config)"
            gmake CC=cc PYTHON="$PYTHON_BIN" PYTHON_CONFIG="$PYTHON_CONFIG"

      - name: Test JSON output on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add -I 'python%3.12'
          run: |
            set -eux
            ./bin/fetch --json | tee fetch.json
            PYTHON_BIN="$(command -v python3.12 || command -v python3.13 || command -v python3.11 || command -v python3)"
            "$PYTHON_BIN" - <<'PY'
            import json

            with open("fetch.json", encoding="utf-8") as stream:
                info = json.load(stream)
            assert isinstance(info, dict)
            assert isinstance(info["disks"], list)
            assert isinstance(info["memory"], dict)
            print(json.dumps(info, indent=2, sort_keys=True))
            print("JSON output is valid")
            PY

      - name: Test LARP frame cycle on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add -I 'python%3.12'
          run: |
            set -eux
            PYTHON_BIN="$(command -v python3.12 || command -v python3.13 || command -v python3.11 || command -v python3)"
            "$PYTHON_BIN" - <<'PY'
            import math
            import sys

            sys.path.insert(0, "larp")
            import larp

            logo = larp.load_logo("unknown")
            start = larp.shaded_logo(logo, 0.0, larp.RAMP, False)
            end = larp.shaded_logo(logo, math.tau, larp.RAMP, False)
            assert start == end, "logo does not return to its starting frame"
            for frame in range(15):
                angle = (frame / 15) * math.tau
                print(f"frame={frame + 1}/15 angle={angle:.6f}")
            print("LARP completes a 360 degree cycle")
            PY

      - name: Test LARP frame output on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add -I 'python%3.12'
          run: |
            set -eux
            ./bin/fetch --larp --frames 15 --no-color > frame-output.txt
            test -s frame-output.txt
            grep -q "CPU" frame-output.txt
            echo "LARP frame output is non-empty"

      - name: Test classic output on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add -I 'python%3.12'
          run: ./bin/fetch --classic
