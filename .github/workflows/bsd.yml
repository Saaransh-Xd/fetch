name: BSD

on:
  push:
  pull_request:

jobs:
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            set -eux
            pkg install -y gmake python3
          run: |
            set -eux
            command -v gmake
            command -v cc
            freebsd-version
            PYTHON_BIN="$(command -v python3.13 || command -v python3.12 || command -v python3.11 || command -v python3)"
            PYTHON_CONFIG="$(command -v python3.13-config || command -v python3.12-config || command -v python3.11-config || command -v python3-config)"
            test -n "$PYTHON_BIN"
            test -n "$PYTHON_CONFIG"
            "$PYTHON_BIN" --version
            "$PYTHON_CONFIG" --includes
            "$PYTHON_CONFIG" --embed --ldflags
            set +e
            gmake CC=cc PYTHON="$PYTHON_BIN" PYTHON_CONFIG="$PYTHON_CONFIG" > build.log 2>&1
            status=$?
            cat build.log
            set -e
            test "$status" -eq 0
            ./bin/fetch > /dev/null
            ./bin/fetch --json | tee fetch.json
            "$PYTHON_BIN" -c 'import json; info=json.load(open("fetch.json")); assert isinstance(info["disks"], list); assert isinstance(info["memory"], dict); print(json.dumps(info, indent=2, sort_keys=True))'
            "$PYTHON_BIN" -c 'import math,sys; sys.path.insert(0,"larp"); import larp; logo=larp.load_logo("unknown"); assert larp.shaded_logo(logo,0.0,larp.RAMP,False)==larp.shaded_logo(logo,math.tau,larp.RAMP,False); assert math.isclose((15/15)*math.tau,math.tau); [print(f"frame={frame + 1}/15 angle={(frame / 15) * math.tau:.6f}") for frame in range(15)]'
            ./bin/fetch --larp --frames 15 --no-color > /dev/null

  openbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            set -eux
            pkg_add -I gmake 'python%3.12'
          run: |
            set -eux
            command -v gmake
            command -v cc
            uname -a
            PYTHON_BIN="$(command -v python3.12 || command -v python3.13 || command -v python3.11 || command -v python3)"
            PYTHON_CONFIG="$(command -v python3.12-config || command -v python3.13-config || command -v python3.11-config || command -v python3-config)"
            test -n "$PYTHON_BIN"
            test -n "$PYTHON_CONFIG"
            "$PYTHON_BIN" --version
            "$PYTHON_CONFIG" --includes
            "$PYTHON_CONFIG" --embed --ldflags
            set +e
            gmake CC=cc PYTHON="$PYTHON_BIN" PYTHON_CONFIG="$PYTHON_CONFIG" > build.log 2>&1
            status=$?
            cat build.log
            set -e
            test "$status" -eq 0
            ./bin/fetch > /dev/null
            ./bin/fetch --json | tee fetch.json
            "$PYTHON_BIN" -c 'import json; info=json.load(open("fetch.json")); assert isinstance(info["disks"], list); assert isinstance(info["memory"], dict); print(json.dumps(info, indent=2, sort_keys=True))'
            "$PYTHON_BIN" -c 'import math,sys; sys.path.insert(0,"larp"); import larp; logo=larp.load_logo("unknown"); assert larp.shaded_logo(logo,0.0,larp.RAMP,False)==larp.shaded_logo(logo,math.tau,larp.RAMP,False); assert math.isclose((15/15)*math.tau,math.tau); [print(f"frame={frame + 1}/15 angle={(frame / 15) * math.tau:.6f}") for frame in range(15)]'
            ./bin/fetch --larp --frames 15 --no-color > /dev/null
