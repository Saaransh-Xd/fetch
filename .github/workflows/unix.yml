name: Unix

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System info
        run: |
          uname -a
          uname -m
          cat /etc/os-release

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Build
        run: make

      - name: Test
        run: ./bin/fetch

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run FreeBSD VM
        uses: cross-platform-actions/action@master
        with:
          operating_system: freebsd
          version: '14.2'
          shell: bash
          run: |
            uname -a
            uname -m
            make
            ./bin/fetch