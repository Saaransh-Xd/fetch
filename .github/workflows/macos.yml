name: macOS

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os:
          - macos-latest
          - macos-15-intel

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System info
        run: |
          uname -a
          uname -m
          sw_vers

      - name: Build
        run: make

      - name: Test JSON output
        run: |
          ./bin/fetch --json | tee fetch.json
          python3 - <<'PY'
          import json

          with open("fetch.json", encoding="utf-8") as stream:
              info = json.load(stream)
          assert isinstance(info, dict)
          assert isinstance(info["disks"], list)
          assert isinstance(info["memory"], dict)
          print(json.dumps(info, indent=2, sort_keys=True))
          print("JSON output is valid")
          PY

      - name: Test LARP 360 degree cycle
        run: |
          python3 - <<'PY'
          import math
          import sys

          sys.path.insert(0, "larp")
          import larp

          logo = larp.load_logo("unknown")
          start = larp.shaded_logo(logo, 0.0, larp.RAMP, False)
          end = larp.shaded_logo(logo, math.tau, larp.RAMP, False)
          assert start == end, "logo does not return to its starting frame"
          assert math.isclose((15 / 15) * math.tau, math.tau)
          for frame in range(15):
              angle = (frame / 15) * math.tau
              print(f"frame={frame + 1}/15 angle={angle:.6f}")
          print("LARP completes a 360 degree cycle")
          PY
          ./bin/fetch --larp --frames 15 --no-color > /dev/null

      - name: Test default output
        run: ./bin/fetch --classic

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sfetch-macos-${{ matrix.os }}
          path: bin/fetch
