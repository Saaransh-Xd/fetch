name: macOS

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os:
          - macos-latest
          - macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System info
        run: |
          uname -a
          uname -m
          sw_vers

      - name: Build
        run: make

      - name: Test
        run: ./bin/fetch

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sfetch-macos-${{ matrix.os }}
          path: bin/fetch        